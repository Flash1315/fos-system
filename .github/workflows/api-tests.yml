name: API and mobile checks

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Test
        env:
          SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:////tmp/fos-ci.db
        run: PYTHONPATH=. pytest -q

  mobile-tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo config gate
        run: |
          set -euo pipefail
          # Missing URL must fail for production env
          if EXPO_PUBLIC_APP_ENV=production node -e "require('./app.config.js')()"; then
            echo "expected production config without URL to fail" >&2
            exit 1
          fi
          EXPO_PUBLIC_APP_ENV=production EXPO_PUBLIC_API_URL=https://api.example.com \
            npx expo config --type public >/tmp/fos-expo-config.json
          grep -q 'api.example.com' /tmp/fos-expo-config.json

  docker-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version sync
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          api = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', pathlib.Path("api/app/version.py").read_text()).group(1)
          pkg = json.loads(pathlib.Path("mobile/package.json").read_text())["version"]
          app = json.loads(pathlib.Path("mobile/app.json").read_text())["expo"]["version"]
          print(f"versions api={api} package={pkg} app={app}")
          assert api == pkg == app, (api, pkg, app)
          PY
      - name: Build API image
        run: docker build -t fos-api ./api
      - name: Health smoke
        run: |
          set -euo pipefail
          docker run -d --name fos-api \
            -e SECRET_KEY=ci-docker-secret-key-32chars-minxx \
            -e DATABASE_URL=sqlite:////tmp/fos.db \
            -e ENVIRONMENT=development \
            -p 8000:8000 \
            fos-api
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/live | grep -q '"ok"'; then
              headers=$(curl -fsS -D- -o /tmp/fos-live.json http://127.0.0.1:8000/health/live)
              echo "$headers"
              echo "$headers" | grep -qi 'cache-control:.*no-store'
              cat /tmp/fos-live.json
              ready=$(curl -fsS http://127.0.0.1:8000/health/ready)
              echo "$ready"
              echo "$ready" | grep -q '"db":"ok"'
              echo "$ready" | grep -q '"limiter"'
              expected=$(python3 -c "import pathlib,re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('api/app/version.py').read_text()).group(1))")
              echo "$ready" | grep -q "\"version\":\"$expected\""
              # Dev image still exposes OpenAPI; prod hide is source-gated (_IS_PROD).
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)
              test "$code" = "200"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            docker logs fos-api || true
            exit 1
          fi
          docker stop fos-api

  pytest-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fos
          POSTGRES_PASSWORD: fos
          POSTGRES_DB: fos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fos -d fos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Smoke on Postgres
        env:
          SECRET_KEY: ci-secret-key-32chars-minimumxx
          DATABASE_URL: postgresql+psycopg2://fos:fos@localhost:5432/fos
          RATE_LIMIT_ENABLED: "0"
        run: |
          PYTHONPATH=. python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              h = client.get("/health")
              assert h.status_code == 200, h.text
              assert h.json()["db"] == "ok"
              reg = client.post(
                  "/orgs/register",
                  json={
                      "name": "CI PG",
                      "slug": "ci-pg",
                      "currency": "IDR",
                      "owner_email": "ci-pg@example.com",
                      "owner_name": "CI",
                      "owner_password": "secret12",
                      "owner_password_confirm": "secret12",
                  },
              )
              assert reg.status_code == 200, reg.text
              login = client.post(
                  "/auth/login",
                  json={
                      "email": "ci-pg@example.com",
                      "password": "secret12",
                      "organization_slug": "ci-pg",
                  },
              )
              assert login.status_code == 200, login.text
              live = client.get("/health/live")
              assert live.status_code == 200
              assert "no-store" in (live.headers.get("cache-control") or "").lower()
              docs = client.get("/docs")
              assert docs.status_code == 200  # development image
          print("postgres smoke ok")
          PY
